function highlightCode(code, lang) {
  const esc = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const pyKw = new Set(['if','elif','else','while','for','in','and','or','not','def','return','break','continue','import','from','as','True','False','None','lambda','global']);
  const pyFn = new Set(['print','input','int','str','float','range','len','abs','max','min','sum']);
  const algKw = new Set(['алг','нач','кон','цел','если','то','иначе','все','нц','кц','раз','использовать','и','или','не','div','mod']);
  const algFn = new Set(['ввод','вывод']);
  const re = /(#[^\n]*|\/\/[^\n]*)|("(?:[^"\n]|\\")*"|'(?:[^'\n]|\\')*')|(\d+(?:\.\d+)?)|([A-Za-z_А-Яа-яЁё][A-Za-z_0-9А-Яа-яЁё]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(esc)) !== null) {
    out += esc.slice(last, m.index);
    if (m[1]) out += '<span class="tok-com">' + m[1] + '</span>';
    else if (m[2]) out += '<span class="tok-str">' + m[2] + '</span>';
    else if (m[3]) out += '<span class="tok-num">' + m[3] + '</span>';
    else if (m[4]) {
      const w = m[4];
      if (lang === 'alg') {
        if (algKw.has(w)) out += '<span class="tok-kw">' + w + '</span>';
        else if (algFn.has(w)) out += '<span class="tok-fn">' + w + '</span>';
        else out += w;
      } else {
        if (pyKw.has(w)) out += '<span class="tok-kw">' + w + '</span>';
        else if (pyFn.has(w)) out += '<span class="tok-fn">' + w + '</span>';
        else out += w;
      }
    }
    last = m.index + m[0].length;
  }
  return out + esc.slice(last);
}

function makeCodeWindow(code, lang, filename) {
  const wrap = document.createElement('div');
  wrap.className = 'code-window';
  const head = document.createElement('div');
  head.className = 'code-window-header';
  head.innerHTML = '<span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="code-filename"></span>';
  head.querySelector('.code-filename').textContent = filename;
  const pre = document.createElement('pre');
  pre.className = 'code-window-body';
  pre.innerHTML = highlightCode(code, lang);
  wrap.appendChild(head);
  wrap.appendChild(pre);
  return wrap;
}

/* Автоматически превращает старые статичные блоки .code-block в окна */
function upgradeStaticCodeBlocks(root) {
  (root || document).querySelectorAll('.code-block').forEach(old => {
    const code = old.textContent;
    const lang = /алг|использовать Черепаха|ввод |вывод |нц |кц /.test(code) ? 'alg' : 'py';
    old.replaceWith(makeCodeWindow(code, lang, lang === 'alg' ? 'program.alg' : 'program.py'));
  });
}
function renderSolutionBlocks(container, solutionText) {
  solutionText.split('\n\n').forEach(part => {
    const trimmed = part.trim();
    if (!trimmed) return;
    if (trimmed.startsWith('CODE:')) {
      const nl = trimmed.indexOf('\n');
      const h = trimmed.slice(5, nl).split(':');
      container.appendChild(makeCodeWindow(trimmed.slice(nl + 1), h[0], h[1]));
    } else if (trimmed.startsWith('PY:')) {
      container.appendChild(makeCodeWindow(trimmed.slice(3), 'py', 'reshenie.py'));
    } else if (trimmed.startsWith('KM:')) {
      container.appendChild(makeCodeWindow(trimmed.slice(3), 'alg', 'kumir.alg'));
    } else {
      const p = document.createElement('p');
      p.innerHTML = trimmed.replace(/\n/g, '<br>');
      container.appendChild(p);
    }
  });
}

                    if f(flag, f(flag1, f(flag2, f(flag3, f(flag4, x))))) == 6:
                        print(flag4, flag3, flag2, flag1, flag)</div>
    <div class="note note-warn">
      <strong>Тонкость перебора:</strong> команды выводятся в порядке выполнения — <code>print(flag4, flag3, flag2, flag1, flag)</code>, потому что самая внутренняя функция применяется первой. Легко перепутать и получить «перевёрнутый» ответ!
    </div>
  `;
  app.appendChild(templates);

  const example1 = document.createElement('section');
  example1.className = 'card';
  example1.innerHTML = `
    <h2 class="card-title">Разбор примера 1 (неизвестная команда)</h2>
    <p><strong>Задание №10386.</strong> У исполнителя Бета две команды, которым присвоены номера:</p>
    <p>1. прибавь 2;<br>2. умножь на b<br>(b — неизвестное натуральное число; b ≥ 2).</p>
    <p>Выполняя первую из них, Бета увеличивает число на экране на 2, а выполняя вторую, умножает это число на b. Программа для исполнителя Бета — это последовательность номеров команд. Известно, что программа 11121 переводит число 4 в число 72. Определите значение b.</p>
    <h3>Решение</h3>
    <p>Выполним программу 11121 по шагам: 4 + 2 = 6; 6 + 2 = 8; 8 + 2 = 10; 10 · b; затем + 2.</p>
    <p>Заметим, что после выполнения первых трёх команд мы получаем число 10. Далее составим и решим уравнение: <span class="formula">10 · b + 2 = 72</span>, откуда 10 · b = 70 и b = 7.</p>
    <p>Приведём другое решение на языке Python:</p>
    <div class="code-block">for b in range(2, 100):
    x = 4 + 2 + 2 + 2
    if (x * b + 2) == 72:
        print(b)</div>
    <div class="note note-success"><strong>Ответ: 7</strong></div>
  `;
  app.appendChild(example1);

  const example2 = document.createElement('section');
  example2.className = 'card';
  example2.innerHTML = `
    <h2 class="card-title">Разбор примера 2 (составление алгоритма)</h2>
    <p><strong>Задание №43654.</strong> У исполнителя Квадратор две команды, которым присвоены номера:</p>
    <p>1. возведи в квадрат<br>2. вычти 5</p>
    <p>Первая из них возводит число на экране во вторую степень, вторая вычитает из числа 5. Исполнитель работает только с натуральными числами.</p>
    <p>Составьте алгоритм получения из числа 3 числа 6, содержащий не более 5 команд. В ответе запишите только номера команд. (Например, 21221 — это алгоритм: вычти 5, возведи в квадрат, вычти 5, вычти 5, возведи в квадрат, который преобразует число 10 в 225.) Если таких алгоритмов более одного, то запишите любой из них.</p>
    <h3>Решение</h3>
    <p>Последовательно перейдём от числа 3 к числу 6: 3² = 9 (команда 1); 9 − 5 = 4 (команда 2); 4² = 16 (команда 1); 16 − 5 = 11 (команда 2); 11 − 5 = 6 (команда 2).</p>
    <p>Проверка: все промежуточные числа натуральные, команд ровно пять. Получаем программу 12122.</p>
    <p>Приведём другое решение на языке Python — перебор всех программ из 5 команд:</p>
    <div class="code-block">def f(flag, x):
    if flag == 1:
        return x ** 2
    if flag == 2:
        return x - 5

x = 3
for flag in range(1, 3):
    for flag1 in range(1, 3):
        for flag2 in range(1, 3):
            for flag3 in range(1, 3):
                for flag4 in range(1, 3):
                    if f(flag, f(flag1, f(flag2, f(flag3, f(flag4, x))))) == 6:
                        print(flag4, flag3, flag2, flag1, flag)</div>
    <div class="note note-success"><strong>Ответ: 12122</strong></div>
  `;
  app.appendChild(example2);

  const mistakes = document.createElement('section');
  mistakes.className = 'card';
  mistakes.innerHTML = `
    <h2 class="card-title">Типичные ошибки</h2>
    <ul>
      <li>❌ Читать программу справа налево или путать порядок команд</li>
      <li>❌ Путать «приписать цифру» (строковая операция: <code>int(str(x) + '2')</code>) с арифметическим действием</li>
      <li>❌ Забывать ограничение «исполнитель работает только с натуральными числами»: деление без остатка, вычитание без ухода в ноль</li>
      <li>❌ В переборе выводить команды в обратном порядке выполнения</li>
      <li>❌ Оставлять отрицательный корень квадратного уравнения при поиске b</li>
      <li>❌ Не проверять, что команд не более пяти</li>
    </ul>
    <div class="note">
      <strong>Совет:</strong> после построения алгоритма прогоните его вручную от начала до конца — это занимает 20 секунд и спасает от потери балла.
    </div>
  `;
  app.appendChild(mistakes);
  upgradeStaticCodeBlocks(app);
}

function createTaskElement(task, num, mode) {
  const taskEl = document.createElement('article');
  taskEl.className = 'task';
  taskEl.dataset.taskId = task.id;

  const header = document.createElement('div');
  header.className = 'task-header';
  const numEl = document.createElement('span');
  numEl.className = 'task-num';
  numEl.textContent = 'Задание ' + num + ' №' + task.num;
  header.appendChild(numEl);
  const linkEl = document.createElement('a');
  linkEl.className = 'task-link';
  linkEl.href = 'https://inf-oge.sdamgia.ru/problem?id=' + task.num;
  linkEl.target = '_blank';
  linkEl.rel = 'noopener';
  linkEl.textContent = 'Оригинал ↗';
  header.appendChild(linkEl);
  taskEl.appendChild(header);

  const textEl = document.createElement('p');
  textEl.className = 'task-text';
  textEl.innerHTML = task.text.replace(/\n/g, '<br>');
  taskEl.appendChild(textEl);

  const inputGroup = document.createElement('div');
  inputGroup.className = 'input-group';
  const label = document.createElement('label');
  label.className = 'input-label';
  label.htmlFor = 'input-' + mode + '-' + task.id;
  label.textContent = 'Ваш ответ:';
  inputGroup.appendChild(label);
  const input = document.createElement('input');
  input.className = 'input';
  input.id = 'input-' + mode + '-' + task.id;
  input.type = 'text';
  input.autocomplete = 'off';
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('spellcheck', 'false');
  input.setAttribute('data-lpignore', 'true');
  input.placeholder = 'Введите число или последовательность команд';
  input.addEventListener('input', (e) => updateAnswer(mode, task.id, e.target.value));
  inputGroup.appendChild(input);
  taskEl.appendChild(inputGroup);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  if (mode === 'practice1') {
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn btn-primary';
    checkBtn.textContent = 'Проверить';
    checkBtn.addEventListener('click', () => checkTask1(task.id));
    btnRow.appendChild(checkBtn);
    const solBtn = document.createElement('button');
    solBtn.className = 'btn btn-secondary';
    solBtn.textContent = 'Показать решение';
    solBtn.addEventListener('click', () => toggleSolution1(task.id));
    btnRow.appendChild(solBtn);
  }
  taskEl.appendChild(btnRow);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = 'feedback-' + task.id;
  taskEl.appendChild(feedback);

  const solution = document.createElement('div');
  solution.className = 'solution';
  solution.id = 'solution-' + task.id;
  const solTitle = document.createElement('div');
  solTitle.className = 'solution-title';
  solTitle.textContent = 'Решение:';
  solution.appendChild(solTitle);
  renderSolutionBlocks(solution, task.solution);
  const solAnswer = document.createElement('p');
  solAnswer.style.marginTop = '10px';
  solAnswer.style.fontWeight = '600';
  solAnswer.style.color = 'var(--text)';
  solAnswer.textContent = 'Ответ: ' + task.answer;
  solution.appendChild(solAnswer);
  taskEl.appendChild(solution);

  return taskEl;
}

function renderPractice1() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">⚡ Практика 1</h2>
      <p class="section-desc">10 заданий. После каждого можно сразу проверить ответ и посмотреть решение.</p>
    </div>
  `;
  app.appendChild(head);
  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice1-tasks';
  app.appendChild(tasksBlock);
  TASKS.slice(0, 10).forEach((task, idx) => {
    tasksBlock.appendChild(createTaskElement(task, idx + 1, 'practice1'));
  });
}

function renderPractice2() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">📝 Практика 2</h2>
      <p class="section-desc">10 заданий. Ответы вводите сразу, но проверка — одной кнопкой в конце.</p>
    </div>
  `;
  app.appendChild(head);
  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice2-tasks';
  app.appendChild(tasksBlock);
  TASKS.slice(10, 20).forEach((task, idx) => {
    tasksBlock.appendChild(createTaskElement(task, idx + 1, 'practice2'));
  });
  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn btn-primary btn-block';
  checkBtn.textContent = '✓ Проверить все ответы';
  checkBtn.style.marginTop = '8px';
  checkBtn.addEventListener('click', checkAllPractice2);
  app.appendChild(checkBtn);
  const resultsPanel = document.createElement('div');
  resultsPanel.className = 'results-panel';
  resultsPanel.id = 'results-panel-2';
  app.appendChild(resultsPanel);
}

function updateAnswer(mode, taskId, value) {
  if (mode === 'practice1') {
    state.answers1[taskId] = value;
    state.showSolution1[taskId] = false;
    const input = document.getElementById('input-practice1-' + taskId);
    const fb = document.getElementById('feedback-' + taskId);
    const sol = document.getElementById('solution-' + taskId);
    if (input) input.classList.remove('correct', 'wrong');
    if (fb) fb.classList.remove('show');
    if (sol) sol.classList.remove('show');
  } else {
    state.answers2[taskId] = value;
  }
}

function checkTask1(taskId) {
  const task = TASKS.find(t => t.id === taskId);
  if (!task) return;
  const input = document.getElementById('input-practice1-' + taskId);
  const feedback = document.getElementById('feedback-' + taskId);
  if (!input || !feedback) return;
  const userAnswer = (state.answers1[taskId] || '').trim();
  if (!userAnswer) {
    feedback.className = 'feedback show error';
    feedback.textContent = 'Введите ответ перед проверкой.';
    input.classList.remove('correct');
    input.classList.add('wrong');
    return;
  }
  if (userAnswer === task.answer) {
    feedback.className = 'feedback show success';
    feedback.textContent = '✓ Верно! Отличная работа.';
    input.classList.remove('wrong');
    input.classList.add('correct');
  } else {
    feedback.className = 'feedback show error';
    feedback.textContent = '✗ Неверно. Правильный ответ: ' + task.answer + '. Посмотрите решение.';
    input.classList.remove('correct');
    input.classList.add('wrong');
  }
}

function toggleSolution1(taskId) {
  state.showSolution1[taskId] = !state.showSolution1[taskId];
  const sol = document.getElementById('solution-' + taskId);
  if (sol) sol.classList.toggle('show', state.showSolution1[taskId]);
}

function checkAllPractice2() {
  const results = [];
  let correct = 0;
  TASKS.slice(10, 20).forEach((task, idx) => {
    const userAnswer = (state.answers2[task.id] || '').trim();
    const isCorrect = userAnswer === task.answer;
    if (isCorrect) correct++;
    results.push({ num: idx + 1, task, userAnswer: userAnswer || '—', isCorrect });
  });
  state.results2 = results;
  renderResults2(results, correct);
}

function renderResults2(results, correct) {
  const panel = document.getElementById('results-panel-2');
  if (!panel) return;
  panel.innerHTML = '';
  panel.classList.add('show');
  const score = document.createElement('div');
  score.className = 'results-score';
  score.innerHTML = `
    <div class="results-score-num">${correct} / 10</div>
    <div class="results-score-label">правильных ответов</div>
  `;
  panel.appendChild(score);
  const progress = document.createElement('div');
  progress.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (correct * 10) + '%';
  progress.appendChild(fill);
  panel.appendChild(progress);
  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'result-item ' + (r.isCorrect ? 'correct' : 'wrong');
    const head = document.createElement('div');
    head.className = 'result-item-head';
    const numEl = document.createElement('span');
    numEl.className = 'result-item-num';
    numEl.textContent = 'Задание ' + r.num + ' №' + r.task.num;
    head.appendChild(numEl);
    const status = document.createElement('span');
    status.className = 'result-item-status ' + (r.isCorrect ? 'correct' : 'wrong');
    status.textContent = r.isCorrect ? 'Верно' : 'Неверно';
    head.appendChild(status);
    item.appendChild(head);
    const answers = document.createElement('div');
    answers.className = 'result-item-answers';
    answers.innerHTML = '<strong>Ваш ответ:</strong> ' + escapeHtml(r.userAnswer) + ' · <strong>Правильный:</strong> ' + escapeHtml(r.task.answer);
    item.appendChild(answers);
    if (!r.isCorrect) {
      const sol = document.createElement('div');
      sol.className = 'result-item-solution';
      renderSolutionBlocks(sol, r.task.solution);
      item.appendChild(sol);
    }
    panel.appendChild(item);
  });
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function switchTab(tabName) {
  state.currentTab = tabName;
  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.dataset.tab === tabName;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  if (tabName === 'theory') renderTheory();
  else if (tabName === 'practice1') renderPractice1();
  else if (tabName === 'practice2') renderPractice2();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });
  renderTheory();
}

init();
</script>
