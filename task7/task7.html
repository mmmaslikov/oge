:root {

  --bg-soft: #f5f5f7;
  --bg-card: #ffffff;
  --text: #1d1d1f;

  --text-muted: #86868b;

  --border-soft: #e8e8ed;

  --accent-hover: #0077ed;

html, body {

  color: var(--text);
  background: var(--bg-soft);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body { padding: 16px; }
.container { max-width: 1000px; margin: 0 auto; }
.header { background: var(--bg-card); border-radius: var(--radius); padding: 28px; margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-soft); }
.header-title { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
.header-sub { color: var(--text-soft); font-size: 15px; }
.header-meta { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; font-size: 13px; color: var(--text-muted); }

.tabs { display: flex; gap: 8px; background: var(--bg-card); padding: 8px; border-radius: var(--radius); margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-soft); overflow-x: auto; }

.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { background: var(--bg-card); border-radius: var(--radius); padding: 26px; margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-soft); }
.card-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.01em; }
h3 { font-size: 17px; font-weight: 600; margin: 20px 0 10px; color: var(--text); }
p { margin-bottom: 12px; color: var(--text-soft); }
p:last-child { margin-bottom: 0; }
ul, ol { margin: 10px 0 14px 24px; color: var(--text-soft); }
li { margin-bottom: 6px; }
strong { color: var(--text); font-weight: 600; }
/* Встроенные упоминания — стандартный шрифт, жирный */
code { font-family: inherit; font-size: inherit; font-weight: 700; color: var(--text); background: transparent; padding: 0; border-radius: 0; }
.note { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 14px 18px; border-radius: 10px; margin: 16px 0; font-size: 14px; color: var(--text); }
.note-warn { background: var(--warning-soft); border-left-color: var(--warning); }
.note-success { background: var(--success-soft); border-left-color: var(--success); }
.note-info { background: #f0f9ff; border-left-color: #0ea5e9; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 20px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; transition: all 0.15s; min-height: 44px; min-width: 44px; text-decoration: none; }

.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-soft); color: var(--text); border: 1px solid var(--border); }

.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.frag-list { margin: 12px 0 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.frag-item { font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text); background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 8px; padding: 6px 14px; }
.frag-letter { font-weight: 700; color: var(--accent); margin-right: 10px; }
/* Таблица фрагментов IP: стандартный шрифт, полужирный */
.ip-table { border-collapse: collapse; margin: 12px 0 14px; font-size: 14px; background: var(--bg-card); }

.ip-table tr.letters td { background: var(--bg-soft); font-weight: 700; }
.input-group { margin-top: 14px; }
.input-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-soft); margin-bottom: 6px; }
.input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; background: var(--bg-card); color: var(--text); transition: border-color 0.15s, box-shadow 0.15s; min-height: 44px; }

.input.correct { border-color: var(--success); background: var(--success-soft); }
.input.wrong { border-color: var(--error); background: var(--error-soft); }
.feedback { margin-top: 10px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 14px; display: none; }
.feedback.show { display: block; }
.feedback.success { background: var(--success-soft); color: #1b7a3d; border: 1px solid #b7ebc9; }

.solution .formula { font-weight: 700; color: var(--text); font-family: "Consolas", "Monaco", monospace; background: var(--bg-card); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
/* Незаметная ссылка на оригинал внутри решения */
.solution-link { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--text-muted); text-decoration: none; }
.solution-link:hover { color: var(--accent); text-decoration: underline; }
.results-panel { background: var(--bg-card); border-radius: var(--radius); padding: 24px; margin-top: 20px; border: 1px solid var(--border-soft); box-shadow: var(--shadow); display: none; }
.results-panel.show { display: block; }
.results-score { text-align: center; padding: 22px; background: var(--accent-soft); border-radius: var(--radius-sm); margin-bottom: 16px; }
.results-score-num { font-size: 52px; font-weight: 700; color: var(--accent); line-height: 1; }
.results-score-label { font-size: 14px; color: var(--text-soft); margin-top: 6px; }
.progress-bar { height: 6px; background: var(--border-soft); border-radius: 3px; overflow: hidden; margin: 12px 0; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
.result-item { padding: 14px 16px; border-radius: var(--radius-sm); margin-bottom: 8px; border: 1px solid var(--border); font-size: 14px; }

.result-item.wrong { background: var(--error-soft); border-color: #f5c6c2; }

.result-item-num { font-weight: 600; color: var(--text); }
.result-item-status { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
.result-item-status.correct { background: var(--success); color: white; }
.result-item-status.wrong { background: var(--error); color: white; }
.result-item-answers { font-size: 13px; color: var(--text-soft); }
.result-item-answers strong { color: var(--text); }
.result-item-solution { margin-top: 10px; font-size: 13px; color: var(--text-soft); line-height: 1.7; }
.result-item-solution p { margin-bottom: 8px; }
.footer { text-align: center; padding: 20px; font-size: 13px; color: var(--text-muted); margin-top: 20px; }
.footer a { color: var(--accent); text-decoration: none; }
.footer a:hover { text-decoration: underline; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.section-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.section-desc { font-size: 14px; color: var(--text-muted); }
@media (max-width: 640px) {

  .ip-table td { padding: 7px 10px; }
  .address-pattern { font-size: 13px; padding: 10px 18px; }
}
</style>

function normalizeAnswer(str) {
  return (str || '').toUpperCase().replace(/[^A-ZА-Я0-9]/g, '');
}

function makeOriginalLink(num) {
  const a = document.createElement('a');
  a.className = 'solution-link';
  a.href = 'https://inf-oge.sdamgia.ru/problem?id=' + num;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = 'Оригинал задания ↗';
  return a;
}

function renderFragments(task) {
  if (task.ip) {
    const table = document.createElement('table');
    table.className = 'ip-table';
    const rowF = document.createElement('tr');
    task.ip.frags.forEach(f => {
      const td = document.createElement('td');
      td.textContent = f;
      rowF.appendChild(td);
    });
    table.appendChild(rowF);
    const rowL = document.createElement('tr');
    rowL.className = 'letters';
    task.ip.letters.forEach(l => {
      const td = document.createElement('td');
      td.textContent = l;
      rowL.appendChild(td);
    });
    table.appendChild(rowL);
    return table;
  }
  const list = document.createElement('div');
  list.className = 'frag-list';
  task.frags.forEach(pair => {
    const item = document.createElement('div');
    item.className = 'frag-item';
    const letter = document.createElement('span');
    letter.className = 'frag-letter';
    letter.textContent = pair[0] + ')';
    item.appendChild(letter);
    item.appendChild(document.createTextNode(pair[1]));
    list.appendChild(item);
  });
  return list;
}

function renderSolutionBlocks(container, solutionText) {
  solutionText.split('\n\n').forEach(part => {
    const trimmed = part.trim();
    if (!trimmed) return;
    const p = document.createElement('p');
    p.innerHTML = trimmed.replace(/\n/g, '<br>');
    container.appendChild(p);
  });
}

      <li>протокол (<strong>http</strong>, <strong>https</strong>, <strong>ftp</strong>);</li>
      <li>символы <strong>://</strong>;</li>
      <li>сервер (например, <strong>zoo.org</strong>);</li>
      <li>символ <strong>/</strong>;</li>
      <li>имя файла (например, <strong>tiger.doc</strong>).</li>
    </ol>
    <h3>Разбор примера (задание №37)</h3>
    <p>Доступ к файлу <strong>tiger.doc</strong>, находящемуся на сервере <strong>zoo.org</strong>, осуществляется по протоколу <strong>http</strong>. Фрагменты адреса закодированы буквами от А до Ж:</p>
    <div class="frag-list">
      <div class="frag-item"><span class="frag-letter">А)</span>.doc</div>
      <div class="frag-item"><span class="frag-letter">Б)</span>zoo</div>
      <div class="frag-item"><span class="frag-letter">В)</span>/</div>
      <div class="frag-item"><span class="frag-letter">Г)</span>://</div>
      <div class="frag-item"><span class="frag-letter">Д)</span>tiger</div>
      <div class="frag-item"><span class="frag-letter">Е)</span>.org</div>
      <div class="frag-item"><span class="frag-letter">Ж)</span>http</div>
    </div>
    <p>Составим адрес по схеме: <strong>http://zoo.org/tiger.doc</strong>. Теперь заменим части адреса буквами в порядке их следования: http — Ж, :// — Г, zoo — Б, .org — Е, / — В, tiger — Д, .doc — А.</p>
    <div class="note note-success"><strong>Ответ: ЖГБЕВДА</strong></div>
    <div class="note note-warn">
      <strong>Подвох:</strong> фрагменты сервера и имени файла часто разорваны в неожиданных местах («magazin.» и «com», «book.» и «txt»). Сначала мысленно соберите полный адрес, и лишь потом расставляйте коды фрагментов.
    </div>
  `;
  app.appendChild(fileCard);

  const mailCard = document.createElement('section');
  mailCard.className = 'card';
  mailCard.innerHTML = `
    <h2 class="card-title">Тип 3. Кодировка адреса почтового ящика</h2>
    <div class="address-pattern">ЯЩИК@СЕРВЕР</div>
    <p><strong>Адрес электронной почты</strong> имеет вид: <strong>имя_ящика@сервер</strong>, где сервер обычно состоит из имени и домена верхнего уровня: <strong>school.edu</strong>, <strong>mail.ru</strong>, <strong>gmail.com</strong>.</p>
    <h3>Алгоритм решения</h3>
    <ol>
      <li>Выпишите из условия имя ящика и сервер.</li>
      <li>Составьте полный адрес: имя, «@», сервер.</li>
      <li>Пройдите по адресу слева направо и заменяйте каждую часть её кодом (цифрой или буквой).</li>
      <li>Запишите получившуюся последовательность подряд.</li>
    </ol>
    <h3>Мини-пример</h3>
    <p>Пусть почтовый ящик <strong>informatics</strong> находится на сервере <strong>school.edu</strong>, а фрагменты адреса закодированы так:</p>
    <div class="frag-list">
      <div class="frag-item"><span class="frag-letter">1)</span>.edu</div>
      <div class="frag-item"><span class="frag-letter">2)</span>informatics</div>
      <div class="frag-item"><span class="frag-letter">3)</span>@</div>
      <div class="frag-item"><span class="frag-letter">4)</span>school</div>
    </div>
    <p>Полный адрес: <strong>informatics@school.edu</strong>. Заменяем части в порядке следования: informatics — 2, @ — 3, school — 4, .edu — 1.</p>
    <div class="note note-success"><strong>Ответ: 2341</strong></div>
    <div class="note note-info">
      <strong>Подвох:</strong> имя ящика и сервер иногда сами разбиты на несколько фрагментов (например, wait_ и for_ и mail). Склеивайте их в правильном порядке, ориентируясь на символ «@»: всё до него — имя ящика, всё после — сервер.
    </div>
  `;
  app.appendChild(mailCard);

  const mistakes = document.createElement('section');
  mistakes.className = 'card';
  mistakes.innerHTML = `
    <h2 class="card-title">Типичные ошибки</h2>
    <ul>
      <li>❌ Писать ответ с пробелами или запятыми — буквы и цифры идут подряд</li>
      <li>❌ Путать порядок частей адреса файла: протокол → :// → сервер → / → файл</li>
      <li>❌ Забывать, что в почтовом адресе «@» стоит между именем ящика и сервером</li>
      <li>❌ В IP-адресах ставить фрагмент без точек в середину адреса или получать число больше 255</li>
      <li>❌ Не проверять себя обратной склейкой адреса</li>
    </ul>
    <div class="note">
      <strong>Совет:</strong> после получения последовательности всегда восстанавливайте адрес целиком и читайте его вслух — ошибка становится видна мгновенно.
    </div>
  `;
  app.appendChild(mistakes);
}

function createTaskElement(task, num, mode) {
  const taskEl = document.createElement('article');
  taskEl.className = 'task';
  taskEl.dataset.taskId = task.id;

  const header = document.createElement('div');
  header.className = 'task-header';
  const numEl = document.createElement('span');
  numEl.className = 'task-num';
  numEl.textContent = 'Задание ' + num + ' №' + task.num;
  header.appendChild(numEl);
  taskEl.appendChild(header);

  const textEl = document.createElement('p');
  textEl.className = 'task-text';
  textEl.innerHTML = task.text.replace(/\n/g, '<br>');
  taskEl.appendChild(textEl);

  taskEl.appendChild(renderFragments(task));

  const inputGroup = document.createElement('div');
  inputGroup.className = 'input-group';
  const label = document.createElement('label');
  label.className = 'input-label';
  label.htmlFor = 'input-' + mode + '-' + task.id;
  label.textContent = 'Ваш ответ (буквы или цифры подряд):';
  inputGroup.appendChild(label);
  const input = document.createElement('input');
  input.className = 'input';
  input.id = 'input-' + mode + '-' + task.id;
  input.type = 'text';
  input.autocomplete = 'off';
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('spellcheck', 'false');
  input.setAttribute('data-lpignore', 'true');
  input.placeholder = 'Например: АБВГДЕЖ или 1234567';
  input.addEventListener('input', (e) => {
    e.target.value = normalizeAnswer(e.target.value);
    updateAnswer(mode, task.id, e.target.value);
  });
  inputGroup.appendChild(input);
  taskEl.appendChild(inputGroup);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  if (mode === 'practice1') {
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn btn-primary';
    checkBtn.textContent = 'Проверить';
    checkBtn.addEventListener('click', () => checkTask1(task.id));
    btnRow.appendChild(checkBtn);
    const solBtn = document.createElement('button');
    solBtn.className = 'btn btn-secondary';
    solBtn.textContent = 'Показать решение';
    solBtn.addEventListener('click', () => toggleSolution1(task.id));
    btnRow.appendChild(solBtn);
  }
  taskEl.appendChild(btnRow);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = 'feedback-' + task.id;
  taskEl.appendChild(feedback);

  const solution = document.createElement('div');
  solution.className = 'solution';
  solution.id = 'solution-' + task.id;
  const solTitle = document.createElement('div');
  solTitle.className = 'solution-title';
  solTitle.textContent = 'Решение:';
  solution.appendChild(solTitle);
  renderSolutionBlocks(solution, task.solution);
  const solAnswer = document.createElement('p');
  solAnswer.style.marginTop = '10px';
  solAnswer.style.fontWeight = '600';
  solAnswer.style.color = 'var(--text)';
  solAnswer.textContent = 'Ответ: ' + task.answer;
  solution.appendChild(solAnswer);
  solution.appendChild(makeOriginalLink(task.num));
  taskEl.appendChild(solution);

  return taskEl;
}

function renderPractice1() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">⚡ Практика 1</h2>
      <p class="section-desc">10 заданий. После каждого можно сразу проверить ответ и посмотреть решение.</p>
    </div>
  `;
  app.appendChild(head);
  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice1-tasks';
  app.appendChild(tasksBlock);
  TASKS.slice(0, 10).forEach((task, idx) => {
    tasksBlock.appendChild(createTaskElement(task, idx + 1, 'practice1'));
  });
}

function renderPractice2() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">📝 Практика 2</h2>
      <p class="section-desc">10 заданий. Ответы вводите сразу, но проверка — одной кнопкой в конце.</p>
    </div>
  `;
  app.appendChild(head);
  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice2-tasks';
  app.appendChild(tasksBlock);
  TASKS.slice(10, 20).forEach((task, idx) => {
    tasksBlock.appendChild(createTaskElement(task, idx + 1, 'practice2'));
  });
  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn btn-primary btn-block';
  checkBtn.textContent = '✓ Проверить все ответы';
  checkBtn.style.marginTop = '8px';
  checkBtn.addEventListener('click', checkAllPractice2);
  app.appendChild(checkBtn);
  const resultsPanel = document.createElement('div');
  resultsPanel.className = 'results-panel';
  resultsPanel.id = 'results-panel-2';
  app.appendChild(resultsPanel);
}

function updateAnswer(mode, taskId, value) {
  if (mode === 'practice1') {
    state.answers1[taskId] = value;
    state.showSolution1[taskId] = false;
    const input = document.getElementById('input-practice1-' + taskId);
    const fb = document.getElementById('feedback-' + taskId);
    const sol = document.getElementById('solution-' + taskId);
    if (input) input.classList.remove('correct', 'wrong');
    if (fb) fb.classList.remove('show');
    if (sol) sol.classList.remove('show');
  } else {
    state.answers2[taskId] = value;
  }
}

function checkTask1(taskId) {
  const task = TASKS.find(t => t.id === taskId);
  if (!task) return;
  const input = document.getElementById('input-practice1-' + taskId);
  const feedback = document.getElementById('feedback-' + taskId);
  if (!input || !feedback) return;
  const userAnswer = normalizeAnswer(state.answers1[taskId]);
  if (!userAnswer) {
    feedback.className = 'feedback show error';
    feedback.textContent = 'Введите ответ перед проверкой.';
    input.classList.remove('correct');
    input.classList.add('wrong');
    return;
  }
  if (userAnswer === task.answer) {
    feedback.className = 'feedback show success';
    feedback.textContent = '✓ Верно! Отличная работа.';
    input.classList.remove('wrong');
    input.classList.add('correct');
  } else {
    feedback.className = 'feedback show error';
    feedback.textContent = '✗ Неверно. Правильный ответ: ' + task.answer + '. Посмотрите решение.';
    input.classList.remove('correct');
    input.classList.add('wrong');
  }
}

function toggleSolution1(taskId) {
  state.showSolution1[taskId] = !state.showSolution1[taskId];
  const sol = document.getElementById('solution-' + taskId);
  if (sol) sol.classList.toggle('show', state.showSolution1[taskId]);
}

function checkAllPractice2() {
  const results = [];
  let correct = 0;
  TASKS.slice(10, 20).forEach((task, idx) => {
    const userAnswer = normalizeAnswer(state.answers2[task.id]);
    const isCorrect = userAnswer === task.answer;
    if (isCorrect) correct++;
    results.push({ num: idx + 1, task, userAnswer: userAnswer || '—', isCorrect });
  });
  state.results2 = results;
  renderResults2(results, correct);
}

function renderResults2(results, correct) {
  const panel = document.getElementById('results-panel-2');
  if (!panel) return;
  panel.innerHTML = '';
  panel.classList.add('show');
  const score = document.createElement('div');
  score.className = 'results-score';
  score.innerHTML = `
    <div class="results-score-num">${correct} / 10</div>
    <div class="results-score-label">правильных ответов</div>
  `;
  panel.appendChild(score);
  const progress = document.createElement('div');
  progress.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (correct * 10) + '%';
  progress.appendChild(fill);
  panel.appendChild(progress);
  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'result-item ' + (r.isCorrect ? 'correct' : 'wrong');
    const head = document.createElement('div');
    head.className = 'result-item-head';
    const numEl = document.createElement('span');
    numEl.className = 'result-item-num';
    numEl.textContent = 'Задание ' + r.num + ' №' + r.task.num;
    head.appendChild(numEl);
    const status = document.createElement('span');
    status.className = 'result-item-status ' + (r.isCorrect ? 'correct' : 'wrong');
    status.textContent = r.isCorrect ? 'Верно' : 'Неверно';
    head.appendChild(status);
    item.appendChild(head);
    const answers = document.createElement('div');
    answers.className = 'result-item-answers';
    answers.innerHTML = '<strong>Ваш ответ:</strong> ' + escapeHtml(r.userAnswer) + ' · <strong>Правильный:</strong> ' + escapeHtml(r.task.answer);
    item.appendChild(answers);
    if (!r.isCorrect) {
      const sol = document.createElement('div');
      sol.className = 'result-item-solution';
      renderSolutionBlocks(sol, r.task.solution);
      const solAnswer = document.createElement('p');
      solAnswer.style.marginTop = '8px';
      solAnswer.style.fontWeight = '600';
      solAnswer.style.color = 'var(--text)';
      solAnswer.textContent = 'Ответ: ' + r.task.answer;
      sol.appendChild(solAnswer);
      sol.appendChild(makeOriginalLink(r.task.num));
      item.appendChild(sol);
    }
    panel.appendChild(item);
  });
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function switchTab(tabName) {
  state.currentTab = tabName;
  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.dataset.tab === tabName;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  if (tabName === 'theory') renderTheory();
  else if (tabName === 'practice1') renderPractice1();
  else if (tabName === 'practice2') renderPractice2();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });
  renderTheory();
}

init();
</script>
