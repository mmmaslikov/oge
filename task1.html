html, body {

}

body { padding: 16px; }

.container { max-width: 1000px; margin: 0 auto; }

.header {
  background: var(--bg-card);

  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);

}

.header-title {
  font-size: 30px;
  font-weight: 700;

.header-sub { color: var(--text-soft); font-size: 15px; }

.header-meta {

  flex-wrap: wrap;

  margin-top: 14px;
  font-size: 13px;
  color: var(--text-muted);
}

.header-meta span { display: flex; align-items: center; gap: 6px; }

.tabs {
  display: flex;
  gap: 8px;
  background: var(--bg-card);
  padding: 8px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-soft);
  overflow-x: auto;
}

  min-width: 140px;
  padding: 12px 16px;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-soft);

  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
}

.tab:hover { background: var(--bg-soft); color: var(--text); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab.active { background: var(--accent); color: white; box-shadow: var(--shadow-sm); }

.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 26px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-soft);
}

.card-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 16px;
  letter-spacing: -0.01em;
}

h3 { font-size: 17px; font-weight: 600; margin: 20px 0 10px; color: var(--text); }
p { margin-bottom: 12px; color: var(--text-soft); }
p:last-child { margin-bottom: 0; }
ul, ol { margin: 10px 0 14px 24px; color: var(--text-soft); }
li { margin-bottom: 6px; }
strong { color: var(--text); font-weight: 600; }

.note {
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  border-radius: 10px;
  margin: 16px 0;
  font-size: 14px;
  color: var(--text);
}
.note-warn { background: var(--warning-soft); border-left-color: var(--warning); }
.note-success { background: var(--success-soft); border-left-color: var(--success); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;

.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-soft); color: var(--text); border: 1px solid var(--border); }

.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.task {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 16px;
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow-sm);
}

.task-header {

  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;

  padding: 4px 12px;

.task-link {

  text-decoration: none;
  padding: 4px 8px;
  border-radius: 6px;
}
.task-link:hover { color: var(--accent); background: var(--accent-soft); }

.task-text {

  margin-bottom: 14px;

}

.input-group { margin-top: 14px; }

.input-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-soft);
  margin-bottom: 6px;
}

.input {

  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: inherit;
  background: var(--bg-card);

  min-height: 44px;

.input:focus {

  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.input.correct { border-color: var(--success); background: var(--success-soft); }
.input.wrong { border-color: var(--error); background: var(--error-soft); }

.feedback {

  font-size: 14px;
  display: none;
}
.feedback.show { display: block; }

.feedback.error { background: var(--error-soft); color: #c41e14; border: 1px solid #f5c6c2; }

    </div>
  `;
  app.appendChild(intro);

  const types = document.createElement('section');
  types.className = 'card';
  types.innerHTML = `
    <h2 class="card-title">Основные кодировки</h2>
    
    <h3>📊 КОИ-8 и Windows-1251 <span class="type-badge koi8">8 бит</span></h3>
    <p>В этих кодировках <strong>каждый символ занимает 8 бит = 1 байт</strong>.</p>
    <p>Это старые кодировки, в которых хранится только русский и латинский алфавит.</p>

    <h3>📊 Unicode / UTF-16 <span class="type-badge utf16">16 бит</span></h3>
    <p>В этих кодировках <strong>каждый символ занимает 16 бит = 2 байта</strong>.</p>
    <p>Это современные кодировки, которые поддерживают символы всех языков мира.</p>

    <h3>📊 Unicode (8 бит) <span class="type-badge koi8">8 бит</span></h3>
    <p>Иногда в задачах встречается вариант Unicode, где символ занимает 8 бит (1 байт). Внимательно читайте условие!</p>

    <div class="note note-warn">
      <strong>Запомните:</strong> если в условии сказано «16 бит» — значит 2 байта на символ. Если «8 бит» — значит 1 байт на символ.
    </div>
  `;
  app.appendChild(types);

  const formula = document.createElement('section');
  formula.className = 'card';
  formula.innerHTML = `
    <h2 class="card-title">Главная формула</h2>
    <p><strong>Информационный объём сообщения (I)</strong> — это количество информации, которое требуется для кодирования всего сообщения. Рассчитывается по формуле:</p>
    <div class="formula-box">
      I = K × i
    </div>
    <p>где:</p>
    <ul>
      <li><strong>K</strong> — количество символов в сообщении;</li>
      <li><strong>i</strong> — информационный вес одного символа (количество бит, необходимое для кодирования одного символа).</li>
    </ul>
    
    <h3>Как решать типовое задание</h3>
    <p>В задании сказано: «Размер уменьшился на <em>X</em> байт». Нужно найти удалённое слово.</p>
    <ol>
      <li>Определите, сколько байт на символ: <strong>1 байт</strong> (КОИ-8, Windows-1251) или <strong>2 байта</strong> (UTF-16)</li>
      <li>Найдите количество удалённых символов: <strong>K = X / i</strong></li>
      <li>Вычтите лишние знаки: запятую и пробел (в сумме 2 символа для 8-битных кодировок, 4 байта для 16-битных)</li>
      <li>Количество букв в слове: <strong>K − 2</strong> (для 8 бит) или <strong>(X − 4) / 2</strong> (для 16 бит)</li>
      <li>Найдите в списке слово с таким количеством букв</li>
    </ol>

    <div class="note">
      <strong>Лайфхак:</strong> если кодировка 8 бит — просто делите байты на 1 и вычитайте 2 (запятая + пробел). Если 16 бит — делите байты на 2 и вычитайте 2.
    </div>
  `;
  app.appendChild(formula);

  const exampleA = document.createElement('section');
  exampleA.className = 'card';
  exampleA.innerHTML = `
    <h2 class="card-title">Разбор примера (16 бит на символ)</h2>
    <p><strong>Задание №10866.</strong> В кодировке UTF-16 каждый символ кодируется 16 битами. Влад написал текст (в нем нет лишних пробелов):</p>
    <p>«Репа, тыква, огурец, артишок, патиссон, картофель — овощи».</p>
    <p>Ученик вычеркнул из списка название одного из овощей. Заодно он вычеркнул ставшие лишними запятые и пробелы — два пробела не должны идти подряд.</p>
    <p>При этом размер нового предложения в данной кодировке оказался на 22 байта меньше, чем размер исходного предложения. Напишите в ответе вычеркнутое название овоща.</p>
    
    <h3>Решение</h3>
    <p>Поскольку один символ кодируется двумя байтами, из текста удалили 11 символов.</p>
    <p>Заметим, что лишние запятая и пробел занимают четыре байта.</p>
    <p>Значит, название овоща, которое удалили из списка, должно состоять из 9 букв, поскольку (22 − 4) : 2 = 9 символов.</p>
    <p>Из всего списка только одно название овоща состоит из 9 букв — картофель.</p>
    
    <div class="note note-success">
      <strong>Ответ: картофель</strong>
    </div>
  `;
  app.appendChild(exampleA);

  const exampleB = document.createElement('section');
  exampleB.className = 'card';
  exampleB.innerHTML = `
    <h2 class="card-title">Разбор примера (8 бит на символ)</h2>
    <p><strong>Задание №43634.</strong> В кодировке КОИ-8 каждый символ кодируется 8 битами. Вова написал текст (в нем нет лишних пробелов):</p>
    <p>«Бор, азот, гелий, натрий, водород, кислород, рентгений, менделевий, резерфордий — химические элементы».</p>
    <p>Ученик вычеркнул из списка название одного химического элемента. Заодно он вычеркнул ставшие лишними запятую и пробел — два пробела не должны идти подряд.</p>
    <p>При этом размер нового предложения в данной кодировке оказался на 11 байт меньше, чем размер исходного предложения. Напишите в ответе вычеркнутое название элемента.</p>
    
    <h3>Решение</h3>
    <p>Поскольку один символ кодируется одним байтом, из текста удалили 11 символов.</p>
    <p>Заметим, что лишние запятая и пробел занимают два байта.</p>
    <p>Значит, название элемента, которое удалили из списка, должно состоять из 9 букв, поскольку (11 − 2) : 1 = 9 символов.</p>
    <p>Из всего списка только одно название химического элемента состоит из 9 букв — рентгений.</p>
    
    <div class="note note-success">
      <strong>Ответ: рентгений</strong>
    </div>
  `;
  app.appendChild(exampleB);

  const mistakes = document.createElement('section');
  mistakes.className = 'card';
  mistakes.innerHTML = `
    <h2 class="card-title">Типичные ошибки</h2>
    <ul>
      <li>❌ Путать кодировки: в КОИ-8 — 1 байт, в UTF-16 — 2 байта на символ</li>
      <li>❌ Забывать вычесть запятую и пробел (они тоже занимают место)</li>
      <li>❌ Не проверять количество букв в каждом слове списка</li>
      <li>❌ Писать ответ с лишними пробелами или знаками препинания</li>
      <li>❌ В заданиях с «двойным словом» забывать, что пробел между словами тоже занимает место</li>
    </ul>
    <div class="note">
      <strong>Совет:</strong> всегда сначала определите кодировку и количество байт на символ — это ключ ко всему решению.
    </div>
  `;
  app.appendChild(mistakes);
}

function renderPractice1() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">Практика 1: мгновенная проверка</h2>
      <p class="section-desc">10 заданий. После каждого можно сразу проверить ответ и посмотреть решение.</p>
    </div>
  `;
  app.appendChild(head);

  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice1-tasks';
  app.appendChild(tasksBlock);

  TASKS.slice(2, 12).forEach((task, idx) => {
    const taskEl = createTaskElement(task, idx + 1, 'practice1');
    tasksBlock.appendChild(taskEl);
  });
}

function renderPractice2() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">Практика 2: проверка в конце</h2>
      <p class="section-desc">10 заданий. Ответы вводите сразу, но проверка — одной кнопкой в конце.</p>
    </div>
  `;
  app.appendChild(head);

  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice2-tasks';
  app.appendChild(tasksBlock);

  TASKS.slice(12, 22).forEach((task, idx) => {
    const taskEl = createTaskElement(task, idx + 1, 'practice2');
    tasksBlock.appendChild(taskEl);
  });

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn btn-primary btn-block';
  checkBtn.textContent = '✓ Проверить все ответы';
  checkBtn.style.marginTop = '8px';
  checkBtn.addEventListener('click', checkAllPractice2);
  app.appendChild(checkBtn);

  const resultsPanel = document.createElement('div');
  resultsPanel.className = 'results-panel';
  resultsPanel.id = 'results-panel-2';
  app.appendChild(resultsPanel);
}

function createTaskElement(task, num, mode) {
  const taskEl = document.createElement('article');
  taskEl.className = 'task';
  taskEl.dataset.taskId = task.id;

  const header = document.createElement('div');
  header.className = 'task-header';

  const numEl = document.createElement('span');
  numEl.className = 'task-num';
  numEl.innerHTML = 'Задание ' + num + ' №' + task.num + getTypeBadge(task.type);
  header.appendChild(numEl);

  const linkEl = document.createElement('a');
  linkEl.className = 'task-link';
  linkEl.href = 'https://inf-oge.sdamgia.ru/problem?id=' + task.num;
  linkEl.target = '_blank';
  linkEl.rel = 'noopener';
  linkEl.textContent = 'Оригинал ↗';
  header.appendChild(linkEl);

  taskEl.appendChild(header);

  const textEl = document.createElement('p');
  textEl.className = 'task-text';
  textEl.textContent = task.text;
  taskEl.appendChild(textEl);

  if (task.text2) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.textContent = task.text2;
    taskEl.appendChild(t);
  }
  if (task.text3) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.textContent = task.text3;
    taskEl.appendChild(t);
  }
  if (task.text4) {
    const t = document.createElement('p');
    t.className = 'task-text';
    t.textContent = task.text4;
    taskEl.appendChild(t);
  }

  const inputGroup = document.createElement('div');
  inputGroup.className = 'input-group';

  const label = document.createElement('label');
  label.className = 'input-label';
  label.htmlFor = 'input-' + mode + '-' + task.id;
  label.textContent = 'Ваш ответ:';
  inputGroup.appendChild(label);

  const input = document.createElement('input');
  input.className = 'input';
  input.id = 'input-' + mode + '-' + task.id;
  input.type = 'text';
  input.autocomplete = 'off';
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('spellcheck', 'false');
  input.setAttribute('data-lpignore', 'true');
  input.placeholder = 'Введите ответ';
  input.addEventListener('input', (e) => {
    updateAnswer(mode, task.id, e.target.value);
  });
  inputGroup.appendChild(input);
  taskEl.appendChild(inputGroup);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  if (mode === 'practice1') {
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn btn-primary';
    checkBtn.textContent = 'Проверить';
    checkBtn.addEventListener('click', () => checkTask1(task.id));
    btnRow.appendChild(checkBtn);

    const solBtn = document.createElement('button');
    solBtn.className = 'btn btn-secondary';
    solBtn.textContent = 'Показать решение';
    solBtn.addEventListener('click', () => toggleSolution1(task.id));
    btnRow.appendChild(solBtn);
  }

  taskEl.appendChild(btnRow);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = 'feedback-' + task.id;
  taskEl.appendChild(feedback);

  const solution = document.createElement('div');
  solution.className = 'solution';
  solution.id = 'solution-' + task.id;
  const solTitle = document.createElement('div');
  solTitle.className = 'solution-title';
  solTitle.textContent = 'Решение:';
  solution.appendChild(solTitle);
  
  const solParagraphs = task.solution.split('\n\n');
  solParagraphs.forEach(para => {
    const p = document.createElement('p');
    p.textContent = para.trim();
    solution.appendChild(p);
  });
  
  const solAnswer = document.createElement('p');
  solAnswer.style.marginTop = '10px';
  solAnswer.style.fontWeight = '600';
  solAnswer.style.color = 'var(--text)';
  solAnswer.textContent = 'Ответ: ' + task.answer;
  solution.appendChild(solAnswer);
  taskEl.appendChild(solution);

  return taskEl;
}

function updateAnswer(mode, taskId, value) {
  if (mode === 'practice1') {
    state.answers1[taskId] = value;
    state.checked1[taskId] = false;
    state.showSolution1[taskId] = false;
    const input = document.getElementById('input-practice1-' + taskId);
    const fb = document.getElementById('feedback-' + taskId);
    const sol = document.getElementById('solution-' + taskId);
    if (input) input.classList.remove('correct', 'wrong');
    if (fb) fb.classList.remove('show');
    if (sol) sol.classList.remove('show');
  } else {
    state.answers2[taskId] = value;
  }
}

function checkTask1(taskId) {
  const task = TASKS.find(t => t.id === taskId);
  if (!task) return;

  const input = document.getElementById('input-practice1-' + taskId);
  const feedback = document.getElementById('feedback-' + taskId);
  if (!input || !feedback) return;

  const userAnswer = (state.answers1[taskId] || '').trim();

  if (!userAnswer) {
    feedback.className = 'feedback show error';
    feedback.textContent = 'Введите ответ перед проверкой.';
    input.classList.remove('correct');
    input.classList.add('wrong');
    return;
  }

  state.checked1[taskId] = true;

  if (userAnswer.toLowerCase() === task.answer.toLowerCase()) {
    feedback.className = 'feedback show success';
    feedback.textContent = '✓ Верно! Отличная работа.';
    input.classList.remove('wrong');
    input.classList.add('correct');
  } else {
    feedback.className = 'feedback show error';
    feedback.textContent = '✗ Неверно. Правильный ответ: ' + task.answer + '. Посмотрите решение.';
    input.classList.remove('correct');
    input.classList.add('wrong');
  }
}

function toggleSolution1(taskId) {
  state.showSolution1[taskId] = !state.showSolution1[taskId];
  const sol = document.getElementById('solution-' + taskId);
  if (sol) {
    sol.classList.toggle('show', state.showSolution1[taskId]);
  }
}

function checkAllPractice2() {
  const results = [];
  let correct = 0;

  TASKS.slice(12, 22).forEach((task, idx) => {
    const num = idx + 1;
    const userAnswer = (state.answers2[task.id] || '').trim();
    const isCorrect = userAnswer.toLowerCase() === task.answer.toLowerCase();
    if (isCorrect) correct++;
    results.push({
      num: num,
      task: task,
      userAnswer: userAnswer || '—',
      correctAnswer: task.answer,
      isCorrect: isCorrect
    });
  });

  state.results2 = results;
  renderResults2(results, correct);
}

function renderResults2(results, correct) {
  const panel = document.getElementById('results-panel-2');
  if (!panel) return;

  panel.innerHTML = '';
  panel.classList.add('show');

  const score = document.createElement('div');
  score.className = 'results-score';
  score.innerHTML = `
    <div class="results-score-num">${correct} / 10</div>
    <div class="results-score-label">правильных ответов</div>
  `;
  panel.appendChild(score);

  const progress = document.createElement('div');
  progress.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (correct * 10) + '%';
  progress.appendChild(fill);
  panel.appendChild(progress);

  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'result-item ' + (r.isCorrect ? 'correct' : 'wrong');

    const head = document.createElement('div');
    head.className = 'result-item-head';

    const numEl = document.createElement('span');
    numEl.className = 'result-item-num';
    numEl.textContent = 'Задание ' + r.num + ' №' + r.task.num;
    head.appendChild(numEl);

    const status = document.createElement('span');
    status.className = 'result-item-status ' + (r.isCorrect ? 'correct' : 'wrong');
    status.textContent = r.isCorrect ? 'Верно' : 'Неверно';
    head.appendChild(status);

    item.appendChild(head);

    const answers = document.createElement('div');
    answers.className = 'result-item-answers';
    answers.innerHTML = '<strong>Ваш ответ:</strong> ' + escapeHtml(r.userAnswer) + ' · <strong>Правильный:</strong> ' + escapeHtml(r.correctAnswer);
    item.appendChild(answers);

    if (!r.isCorrect) {
      const sol = document.createElement('div');
      sol.style.cssText = 'margin-top:10px;font-size:13px;color:var(--text-soft);line-height:1.6;';
      const solParagraphs = r.task.solution.split('\n\n');
      solParagraphs.forEach(para => {
        const p = document.createElement('p');
        p.textContent = para.trim();
        p.style.marginBottom = '6px';
        sol.appendChild(p);
      });
      item.appendChild(sol);
    }

    panel.appendChild(item);
  });

  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function switchTab(tabName) {
  state.currentTab = tabName;

  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.dataset.tab === tabName;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });

  if (tabName === 'theory') renderTheory();
  else if (tabName === 'practice1') renderPractice1();
  else if (tabName === 'practice2') renderPractice2();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  renderTheory();
}

init();
</script>
