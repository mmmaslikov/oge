function buildGraphTable(graph) {
  const wrap = document.createElement('div');
  wrap.className = 'graph-wrap';
  const table = document.createElement('table');
  table.className = 'graph-table';
  const head = document.createElement('tr');
  const corner = document.createElement('th');
  corner.textContent = '';
  head.appendChild(corner);
  graph.nodes.forEach(n => {
    const th = document.createElement('th');
    th.textContent = n;
    head.appendChild(th);
  });
  table.appendChild(head);
  graph.matrix.forEach((row, i) => {
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.textContent = graph.nodes[i];
    tr.appendChild(th);
    row.forEach(cell => {
      const td = document.createElement('td');
      if (cell === null || cell === undefined) {
        td.className = 'empty';
        td.textContent = '';
      } else {
        td.textContent = cell;
      }
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  wrap.appendChild(table);
  return wrap;
}

function renderSolutionBlocks(container, solutionText) {
  const parts = solutionText.split('\n\n');
  parts.forEach(part => {
    const trimmed = part.trim();
    if (!trimmed) return;
    const p = document.createElement('p');
    p.innerHTML = trimmed.replace(/\n/g, '<br>');
    container.appendChild(p);
  });
}

    <p>В задании 4 ОГЭ условие даётся в виде <strong>таблицы смежности</strong>: строки и столбцы — это пункты, а на пересечении стоит длина дороги между ними. Пустая клетка означает, что прямой дороги между пунктами нет.</p>
    <div class="note">

      <li>❌ Не замечать требование «через пункт С» или «каждый пункт — только один раз»</li>

function createTaskElement(task, num, mode) {
  const taskEl = document.createElement('article');
  taskEl.className = 'task';
  taskEl.dataset.taskId = task.id;

  const header = document.createElement('div');
  header.className = 'task-header';
  const numEl = document.createElement('span');
  numEl.className = 'task-num';
  numEl.textContent = 'Задание ' + num + ' №' + task.num;
  header.appendChild(numEl);
  const linkEl = document.createElement('a');
  linkEl.className = 'task-link';
  linkEl.href = 'https://inf-oge.sdamgia.ru/problem?id=' + task.num;
  linkEl.target = '_blank';
  linkEl.rel = 'noopener';
  linkEl.textContent = 'Оригинал ↗';
  header.appendChild(linkEl);
  taskEl.appendChild(header);

  const textEl = document.createElement('p');
  textEl.className = 'task-text';
  textEl.innerHTML = task.text.replace(/\n/g, '<br>');
  taskEl.appendChild(textEl);

  taskEl.appendChild(buildGraphTable(task.graph));

  if (task.question) {
    const q = document.createElement('p');
    q.className = 'task-text';
    q.innerHTML = task.question.replace(/\n/g, '<br>');
    taskEl.appendChild(q);
  }

  const inputGroup = document.createElement('div');
  inputGroup.className = 'input-group';
  const label = document.createElement('label');
  label.className = 'input-label';
  label.htmlFor = 'input-' + mode + '-' + task.id;
  label.textContent = 'Ваш ответ:';
  inputGroup.appendChild(label);
  const input = document.createElement('input');
  input.className = 'input';
  input.id = 'input-' + mode + '-' + task.id;
  input.type = 'text';
  input.autocomplete = 'off';
  input.placeholder = 'Введите число';
  input.addEventListener('input', (e) => updateAnswer(mode, task.id, e.target.value));
  inputGroup.appendChild(input);
  taskEl.appendChild(inputGroup);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  if (mode === 'practice1') {
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn btn-primary';
    checkBtn.textContent = 'Проверить';
    checkBtn.addEventListener('click', () => checkTask1(task.id));
    btnRow.appendChild(checkBtn);
    const solBtn = document.createElement('button');
    solBtn.className = 'btn btn-secondary';
    solBtn.textContent = 'Показать решение';
    solBtn.addEventListener('click', () => toggleSolution1(task.id));
    btnRow.appendChild(solBtn);
  }
  taskEl.appendChild(btnRow);

  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = 'feedback-' + task.id;
  taskEl.appendChild(feedback);

  const solution = document.createElement('div');
  solution.className = 'solution';
  solution.id = 'solution-' + task.id;
  const solTitle = document.createElement('div');
  solTitle.className = 'solution-title';
  solTitle.textContent = 'Решение:';
  solution.appendChild(solTitle);
  renderSolutionBlocks(solution, task.solution);
  const solAnswer = document.createElement('p');
  solAnswer.style.marginTop = '10px';
  solAnswer.style.fontWeight = '600';
  solAnswer.style.color = 'var(--text)';
  solAnswer.textContent = 'Ответ: ' + task.answer;
  solution.appendChild(solAnswer);
  taskEl.appendChild(solution);

  return taskEl;
}

function renderPractice1() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">⚡ Практика 1</h2>
      <p class="section-desc">10 заданий. После каждого можно сразу проверить ответ и посмотреть решение.</p>
    </div>
  `;
  app.appendChild(head);
  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice1-tasks';
  app.appendChild(tasksBlock);
  TASKS.slice(0, 10).forEach((task, idx) => {
    tasksBlock.appendChild(createTaskElement(task, idx + 1, 'practice1'));
  });
}

function renderPractice2() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div>
      <h2 class="section-title">📝 Практика 2</h2>
      <p class="section-desc">10 заданий. Ответы вводите сразу, но проверка — одной кнопкой в конце.</p>
    </div>
  `;
  app.appendChild(head);
  const tasksBlock = document.createElement('div');
  tasksBlock.id = 'practice2-tasks';
  app.appendChild(tasksBlock);
  TASKS.slice(10, 20).forEach((task, idx) => {
    tasksBlock.appendChild(createTaskElement(task, idx + 1, 'practice2'));
  });
  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn btn-primary btn-block';
  checkBtn.textContent = '✓ Проверить все ответы';
  checkBtn.style.marginTop = '8px';
  checkBtn.addEventListener('click', checkAllPractice2);
  app.appendChild(checkBtn);
  const resultsPanel = document.createElement('div');
  resultsPanel.className = 'results-panel';
  resultsPanel.id = 'results-panel-2';
  app.appendChild(resultsPanel);
}

function updateAnswer(mode, taskId, value) {
  if (mode === 'practice1') {
    state.answers1[taskId] = value;
    state.showSolution1[taskId] = false;
    const input = document.getElementById('input-practice1-' + taskId);
    const fb = document.getElementById('feedback-' + taskId);
    const sol = document.getElementById('solution-' + taskId);
    if (input) input.classList.remove('correct', 'wrong');
    if (fb) fb.classList.remove('show');
    if (sol) sol.classList.remove('show');
  } else {
    state.answers2[taskId] = value;
  }
}

function checkTask1(taskId) {
  const task = TASKS.find(t => t.id === taskId);
  if (!task) return;
  const input = document.getElementById('input-practice1-' + taskId);
  const feedback = document.getElementById('feedback-' + taskId);
  if (!input || !feedback) return;
  const userAnswer = (state.answers1[taskId] || '').trim();
  if (!userAnswer) {
    feedback.className = 'feedback show error';
    feedback.textContent = 'Введите ответ перед проверкой.';
    input.classList.remove('correct');
    input.classList.add('wrong');
    return;
  }
  if (userAnswer === task.answer) {
    feedback.className = 'feedback show success';
    feedback.textContent = '✓ Верно! Отличная работа.';
    input.classList.remove('wrong');
    input.classList.add('correct');
  } else {
    feedback.className = 'feedback show error';
    feedback.textContent = '✗ Неверно. Правильный ответ: ' + task.answer + '. Посмотрите решение.';
    input.classList.remove('correct');
    input.classList.add('wrong');
  }
}

function toggleSolution1(taskId) {
  state.showSolution1[taskId] = !state.showSolution1[taskId];
  const sol = document.getElementById('solution-' + taskId);
  if (sol) sol.classList.toggle('show', state.showSolution1[taskId]);
}

function checkAllPractice2() {
  const results = [];
  let correct = 0;
  TASKS.slice(10, 20).forEach((task, idx) => {
    const userAnswer = (state.answers2[task.id] || '').trim();
    const isCorrect = userAnswer === task.answer;
    if (isCorrect) correct++;
    results.push({ num: idx + 1, task, userAnswer: userAnswer || '—', isCorrect });
  });
  state.results2 = results;
  renderResults2(results, correct);
}

function renderResults2(results, correct) {
  const panel = document.getElementById('results-panel-2');
  if (!panel) return;
  panel.innerHTML = '';
  panel.classList.add('show');
  const score = document.createElement('div');
  score.className = 'results-score';
  score.innerHTML = `
    <div class="results-score-num">${correct} / 10</div>
    <div class="results-score-label">правильных ответов</div>
  `;
  panel.appendChild(score);
  const progress = document.createElement('div');
  progress.className = 'progress-bar';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  fill.style.width = (correct * 10) + '%';
  progress.appendChild(fill);
  panel.appendChild(progress);
  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'result-item ' + (r.isCorrect ? 'correct' : 'wrong');
    const head = document.createElement('div');
    head.className = 'result-item-head';
    const numEl = document.createElement('span');
    numEl.className = 'result-item-num';
    numEl.textContent = 'Задание ' + r.num + ' №' + r.task.num;
    head.appendChild(numEl);
    const status = document.createElement('span');
    status.className = 'result-item-status ' + (r.isCorrect ? 'correct' : 'wrong');
    status.textContent = r.isCorrect ? 'Верно' : 'Неверно';
    head.appendChild(status);
    item.appendChild(head);
    const answers = document.createElement('div');
    answers.className = 'result-item-answers';
    answers.innerHTML = '<strong>Ваш ответ:</strong> ' + escapeHtml(r.userAnswer) + ' · <strong>Правильный:</strong> ' + escapeHtml(r.task.answer);
    item.appendChild(answers);
    if (!r.isCorrect) {
      const sol = document.createElement('div');
      sol.className = 'result-item-solution';
      renderSolutionBlocks(sol, r.task.solution);
      item.appendChild(sol);
    }
    panel.appendChild(item);
  });
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function switchTab(tabName) {
  state.currentTab = tabName;
  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.dataset.tab === tabName;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
  });
  if (tabName === 'theory') renderTheory();
  else if (tabName === 'practice1') renderPractice1();
  else if (tabName === 'practice2') renderPractice2();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });
  renderTheory();
}

init();
</script>
